# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).

version: 2

updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /harness
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all-npm:
        patterns:
          - '*'

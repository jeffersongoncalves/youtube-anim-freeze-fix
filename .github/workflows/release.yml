name: Build extension ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the ZIP to
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target tag
        id: tag
        run: echo "value=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Read version from manifest
        id: manifest
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build ZIP (extension files only)
        run: |
          zip -r "youtube-anim-freeze-fix-${{ steps.manifest.outputs.version }}.zip" \
            manifest.json *.js

      - name: Show ZIP contents
        run: unzip -l "youtube-anim-freeze-fix-${{ steps.manifest.outputs.version }}.zip"

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" \
            "youtube-anim-freeze-fix-${{ steps.manifest.outputs.version }}.zip" \
            --clobber
